name: 部署網站

# GitHub 內建的「pages build and deployment」（Jekyll 舊路徑）在 2026-08-06
# 連續 7 次以 `Timeout reached, aborting!` 失敗：build 每次成功，deploy 步驟
# 送出請求後輪詢滿 10 分鐘等不到 Pages 後端回報完成。內容本身沒有問題
# （倉庫 32 檔、129 KiB），是 GitHub 那條管線卡住。
#
# 這個站台是純靜態的 HTML/CSS/JS/JSON，本來就不需要 Jekyll。改用明確的
# Actions 部署除了繞開卡死的舊路徑，失敗時也才看得到真正的錯誤訊息。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write     # 失敗時開 issue 通知

# 排隊而不是互相取消。「更新總經數值」推完資料會緊接著觸發這裡，
# cancel-in-progress 會把前一次砍在半路——今天就是這樣互相取消過。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # enablement: true —— 站台被 Unpublish 後由這一步自己重新建立
      # （build_type 直接設成 workflow，不會退回 Jekyll 舊路徑），
      # 不需要再進 Settings 手動開一次。站台已存在時這個參數不做事。
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: 打包整個站台
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'          # .git 與 .github 由 action 自動排除

      - name: 發佈到 GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

      - name: 失敗時開 issue 通知
        # 2026-08-06 那次連續 7 天部署卡死，是靠人工察覺才發現的。
        # 部署失敗跟抓取失敗要分開看：repo 資料是新的，只有線上頁面停在舊版。
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="🔴 自動化失敗：${{ github.workflow }}"
          body=$(printf '%s\n' \
            "**workflow**：${{ github.workflow }}" \
            "**觸發方式**：${{ github.event_name }}" \
            "**時間**：$(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M') 台北" \
            "**log**：$RUN_URL" \
            "" \
            "repo 裡的資料是新的，只有線上網站停在舊版。多數情況重跑一次本 workflow 即可。" \
            "處理完請把這張 issue 關掉——還開著的話，之後的失敗只會累積留言不會另開新張。")
          existing=$(gh issue list --state open --label automation-failure --limit 50 \
            --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -1)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --label automation-failure --body "$body"
          fi
